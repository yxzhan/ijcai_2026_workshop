# ros2_control for the lobby's FR3 with its hand, for giskardpy: the arm's
# joints velocity commanded (forward_velocity_controller, which giskard's
# universal_robot_velocity finds and commands), the hand as in
# ../fr3_roscontrol (a parallel gripper controller, /fr3_gripper/gripper_cmd).
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    fr3_gripper:
      type: parallel_gripper_action_controller/GripperActionController

forward_velocity_controller:
  ros__parameters:
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]

fr3_gripper:
  ros__parameters:
    joint: fr3_finger_joint1  # each finger's opening, 0-0.04 m (the lobby's fr3_hand actuator)
